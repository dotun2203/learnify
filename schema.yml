        cover:
          type: string
          format: uri
          nullable: true
        price_kobo:
          type: integer
          maximum: 2147483647
          minimum: 0
        schedule_type:
          $ref: '#/components/schemas/ScheduleTypeEnum'
        drip_interval_days:
          type: integer
          maximum: 32767
          minimum: 0
        delivery_time:
          type: string
          format: time
        timezone:
          type: string
