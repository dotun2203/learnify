openapi: 3.0.3
info:
  title: Learnify API
  version: 1.0.0
  description: Backend API for the Learnify learning commerce platform
paths:
  /api/v1/academies/:
    get:
      operationId: api_v1_academies_list
      description: Academies the current user belongs to.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademyList'
          description: ''
    post:
      operationId: api_v1_academies_create
      description: Academies the current user belongs to.
      tags:
      - academies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademyCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademyCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademyCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Academy'
          description: ''
  /api/v1/academies/{slug}/:
    get:
      operationId: api_v1_academies_retrieve
      description: Academies the current user belongs to.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Academy'
          description: ''
    patch:
      operationId: api_v1_academies_partial_update
      description: Academies the current user belongs to.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - academies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcademyUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAcademyUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademyUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Academy'
          description: ''
  /api/v1/academies/{slug}/logo/:
    post:
      operationId: api_v1_academies_logo_create
      description: Academies the current user belongs to.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - academies
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Academy'
          description: ''
  /api/v1/academies/{slug}/onboarding/:
    get:
      operationId: api_v1_academies_onboarding_retrieve
      description: Academies the current user belongs to.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - academies
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding'
          description: ''
  /api/v1/academies/slug-available/:
    get:
      operationId: api_v1_academies_slug_available_retrieve
      description: Live check for the 'choose your address' field in the signup wizard.
      parameters:
      - in: query
        name: slug
        schema:
          type: string
      tags:
      - academies
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugAvailability'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: Base for endpoints anyone can call (no token needed).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: api_v1_auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/otp/login/:
    post:
      operationId: api_v1_auth_otp_login_create
      description: Base for endpoints anyone can call (no token needed).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: api_v1_auth_otp_request_create
      description: Base for endpoints anyone can call (no token needed).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: api_v1_auth_otp_verify_create
      description: Base for endpoints anyone can call (no token needed).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: api_v1_auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/reset/:
    post:
      operationId: api_v1_auth_password_reset_create
      description: Base for endpoints anyone can call (no token needed).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierOnlyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentifierOnlyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentifierOnlyRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: api_v1_auth_password_reset_confirm_create
      description: Base for endpoints anyone can call (no token needed).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: api_v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: api_v1_auth_register_create
      description: Base for endpoints anyone can call (no token needed).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/learn/enrollments/:
    get:
      operationId: api_v1_learn_enrollments_list
      description: 'The student portal: my courses and my lesson list.'
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnrollmentList'
          description: ''
  /api/v1/learn/enrollments/{enrollment_id}/lessons/{lesson_id}/:
    get:
      operationId: api_v1_learn_enrollments_lessons_retrieve
      description: GET a released lesson's content; POST marks it complete.
      parameters:
      - in: path
        name: enrollment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lesson_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learn
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
    post:
      operationId: api_v1_learn_enrollments_lessons_create
      description: GET a released lesson's content; POST marks it complete.
      parameters:
      - in: path
        name: enrollment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: lesson_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - learn
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
          description: ''
  /api/v1/learn/enrollments/{id}/:
    get:
      operationId: api_v1_learn_enrollments_retrieve
      description: 'The student portal: my courses and my lesson list.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this enrollment.
        required: true
      tags:
      - learn
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentDetail'
          description: ''
  /api/v1/learn/notifications/:
    get:
      operationId: api_v1_learn_notifications_list
      description: The portal's bell menu — this is the 'web channel' inbox.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
    post:
      operationId: api_v1_learn_notifications_create
      description: Mark everything as read.
      tags:
      - learn
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/public/academies/{academy_slug}/courses/:
    get:
      operationId: api_v1_public_academies_courses_list
      description: Catalogue for an academy's landing page.
      parameters:
      - in: path
        name: academy_slug
        schema:
          type: string
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicCourseList'
          description: ''
  /api/v1/public/academies/{academy_slug}/courses/{course_slug}/:
    get:
      operationId: api_v1_public_academies_courses_retrieve
      description: 'The sales page: outline visible, lesson bodies hidden.'
      parameters:
      - in: path
        name: academy_slug
        schema:
          type: string
        required: true
      - in: path
        name: course_slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCourseDetail'
          description: ''
  /api/v1/public/academies/{academy_slug}/courses/{course_slug}/enroll/:
    post:
      operationId: api_v1_public_academies_courses_enroll_create
      description: Free courses only. Paid ones go through checkout once payments
        ship.
      parameters:
      - in: path
        name: academy_slug
        schema:
          type: string
        required: true
      - in: path
        name: course_slug
        schema:
          type: string
        required: true
      tags:
      - public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicEnrollRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicEnrollRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicEnrollRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
          description: ''
  /api/v1/public/academies/{slug}/:
    get:
      operationId: api_v1_public_academies_retrieve
      description: The academy's public profile, used by its landing page.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAcademy'
          description: ''
  /api/v1/studio/courses/:
    get:
      operationId: api_v1_studio_courses_list
      description: 'Studio: /studio/courses/ — always scoped to the X-Academy header.'
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - draft
          - published
        description: |-
          * `draft` - Draft
          * `published` - Published
          * `archived` - Archived
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseList'
          description: ''
    post:
      operationId: api_v1_studio_courses_create
      description: 'Studio: /studio/courses/ — always scoped to the X-Academy header.'
      tags:
      - studio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseWriteRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/v1/studio/courses/{id}/:
    get:
      operationId: api_v1_studio_courses_retrieve
      description: 'Studio: /studio/courses/ — always scoped to the X-Academy header.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this course.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
    put:
      operationId: api_v1_studio_courses_update
      description: 'Studio: /studio/courses/ — always scoped to the X-Academy header.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this course.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseWriteRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseWrite'
          description: ''
    patch:
      operationId: api_v1_studio_courses_partial_update
      description: 'Studio: /studio/courses/ — always scoped to the X-Academy header.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this course.
        required: true
      tags:
      - studio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourseWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourseWriteRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
    delete:
