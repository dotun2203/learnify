components:
  schemas:
    Academy:
      type: object
      description: 'Studio view: what a member sees.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        tagline:
          type: string
          maxLength: 160
        description:
          type: string
        logo:
          type: string
          format: uri
          nullable: true
        brand_color:
          type: string
          maxLength: 7
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        support_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        whatsapp_number:
          type: string
          maxLength: 15
        status:
          allOf:
          - $ref: '#/components/schemas/AcademyStatusEnum'
          readOnly: true
        role:
          type: string
          nullable: true
          readOnly: true
        activated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - activated_at
      - created_at
      - id
      - name
      - role
      - slug
      - status
    AcademyAccess:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - role
      - slug
    AcademyCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          type: string
          minLength: 1
          description: Your academy address, e.g. grace-bible-school
          pattern: ^[-a-zA-Z0-9_]+$
        tagline:
          type: string
          maxLength: 160
        description:
          type: string
        brand_color:
          type: string
          minLength: 1
          maxLength: 7
      required:
      - name
      - slug
    AcademyStatusEnum:
      enum:
      - onboarding
      - active
      - suspended
      - closed
      type: string
      description: |-
        * `onboarding` - Onboarding
        * `active` - Active
        * `suspended` - Suspended
        * `closed` - Closed
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        file:
          type: string
          format: uri
        kind:
          $ref: '#/components/schemas/KindEnum'
        original_name:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        position:
          type: integer
          readOnly: true
      required:
      - file
      - id
      - original_name
      - position
      - size_bytes
    AssetRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - file
    AuthResponse:
      type: object
      description: 'Login/register response: tokens + the same payload as GET /me/.'
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
        academies:
          type: array
          items:
            $ref: '#/components/schemas/AcademyAccess'
        is_student:
          type: boolean
        is_platform_admin:
          type: boolean
      required:
      - academies
      - access
      - is_platform_admin
      - is_student
      - refresh
      - user
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        subtitle:
          type: string
          maxLength: 200
        description:
          type: string
        cover:
          type: string
          format: uri
          nullable: true
        price_kobo:
          type: integer
          maximum: 2147483647
          minimum: 0
        price_naira:
          type: number
          format: double
          readOnly: true
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CourseStatusEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        schedule_type:
          $ref: '#/components/schemas/ScheduleTypeEnum'
        drip_interval_days:
          type: integer
          maximum: 32767
          minimum: 0
        delivery_time:
          type: string
          format: time
        timezone:
          type: string
          maxLength: 50
        require_sequential:
          type: boolean
          description: Also require the previous lesson to be completed before unlocking
        lesson_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - currency
      - id
      - lesson_count
      - price_naira
      - published_at
      - slug
      - status
      - title
      - updated_at
    CourseDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        subtitle:
          type: string
          maxLength: 200
        description:
          type: string
        cover:
          type: string
          format: uri
          nullable: true
        price_kobo:
          type: integer
          maximum: 2147483647
          minimum: 0
        price_naira:
          type: number
          format: double
          readOnly: true
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CourseStatusEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        schedule_type:
          $ref: '#/components/schemas/ScheduleTypeEnum'
        drip_interval_days:
          type: integer
          maximum: 32767
          minimum: 0
        delivery_time:
          type: string
          format: time
        timezone:
          type: string
          maxLength: 50
        require_sequential:
          type: boolean
          description: Also require the previous lesson to be completed before unlocking
        lesson_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        modules:
          type: array
          items:
            $ref: '#/components/schemas/Module'
          readOnly: true
      required:
      - created_at
      - currency
      - id
      - lesson_count
      - modules
      - price_naira
      - published_at
      - slug
      - status
      - title
      - updated_at
    CourseStatusEnum:
      enum:
