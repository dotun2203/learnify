# Local development stack.
x-app: &app
  build: .
  env_file: .env
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis-queue:
      condition: service_healthy
    redis-cache:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Celery broker: must never evict keys
  redis-queue:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisqueue:/data
    ports:
      - "6377:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Cache / throttling / locks: free to evict
  redis-cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6388:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8001:8000"

  worker:
    <<: *app
    command: celery -A config worker -l info -Q default,webhooks,delivery -c 4

  worker-ai:
    <<: *app
    command: celery -A config worker -l info -Q ai,documents -c 2

  beat:
    <<: *app
    command: celery -A config beat -l info

volumes:
  pgdata:
  redisqueue:
