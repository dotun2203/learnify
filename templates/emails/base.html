<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; -webkit-text-size-adjust:100%;">
  {# Preview text shown next to the subject in the inbox list #}
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#f4f5f7;">
    {% block preheader %}{% endblock %}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">

          <tr>
            <td style="padding:0 8px 20px 8px; font-family:Arial, Helvetica, sans-serif; font-size:22px; font-weight:bold; color:#1f2a44;">
              {{ brand_name }}
            </td>
          </tr>

          <tr>
            <td style="background-color:#ffffff; border-radius:8px; padding:32px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:24px; color:#1f2a44;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="padding:20px 8px 0 8px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:18px; color:#6b7280;">
              Need help? Contact us at
              <a href="mailto:{{ support_email }}" style="color:#6b7280; text-decoration:underline;">{{ support_email }}</a>.<br>
              &copy; {{ year }} {{ brand_name }}
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
