# Production stack (Coolify). Set variables in Coolify's Environment Variables tab.
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
  DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
  CELERY_BROKER_URL: redis://redis-queue:6379/0
  REDIS_CACHE_URL: redis://redis-cache:6379/0
  FRONTEND_URL: ${FRONTEND_URL:?}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Learnify <no-reply@learnify.local>}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app: &app
  build:
    context: .
    args:
      REQUIREMENTS: requirements/prod.txt
  restart: unless-stopped
  environment: *app-env
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis-queue:
      condition: service_healthy
    redis-cache:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Celery broker: must never evict keys
  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisqueue:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Cache / throttling / locks: free to evict
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    expose:
      - "8000"

  worker:
    <<: *app
    command: celery -A config worker -l info -Q default,webhooks,delivery -c 4

  worker-ai:
    <<: *app
    command: celery -A config worker -l info -Q ai,documents -c 2

  beat:
    <<: *app
    command: celery -A config beat -l info

volumes:
  pgdata:
  redisqueue:
  media:
